<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>{{ partial "head.html" . }}</head>
<body>
  <div id="rail"><canvas id="rail-canvas"></canvas></div>

  <header class="site-header">
    <a class="wordmark" href="{{ "/" | relURL }}"><span class="dot"></span><span>Yassin Abdelkassar</span></a>
    <nav>
      <a href="{{ "/posts/" | relURL }}">Writing</a>
      <a href="{{ "/#projects" | relURL }}">Projects</a>
      <a href="{{ "/#about" | relURL }}">About</a>
      <button id="theme-toggle" aria-label="Toggle theme">
        <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2.5"></circle><path d="M16 2 A14 14 0 0 1 16 30 Z" fill="currentColor"></path></svg>
      </button>
    </nav>
  </header>

  {{ block "main" . }}{{ end }}

  <footer class="site-footer">
    <span>Yassin Abdelkassar — abdelkassar.com</span>
    <span>© {{ now.Format "2006" }} · still growing</span>
  </footer>

  <script src="{{ "js/garden.js" | relURL }}"></script>
  {{ if .Site.Params.enable_math }}
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'\\(',right:'\\)',display:false}]})"></script>
  {{ end }}
</body>
</html>
